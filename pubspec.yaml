name: ventra
description: "A premium event booking and social platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  firebase_auth: ^6.1.2
  url_launcher: ^6.3.2
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  go_router: ^17.0.0
  provider: ^6.1.5+1
  firebase_messaging: ^16.1.0
  shared_preferences: ^2.5.4
  firebase_storage: ^13.0.4
  image_picker: ^1.2.1
  intl: ^0.20.2
  firebase_ui_database: ^2.0.1
  onesignal_flutter: ^5.3.4
  path_provider: ^2.1.5
  flutter_image_compress: ^2.4.0
  flutter_launcher_icons: ^0.14.4
  cached_network_image: ^3.4.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_local_notifications: ^19.5.0
  qr_flutter: ^4.1.0
  confetti: ^0.8.0
  supabase_flutter: ^2.12.0
  flutter_native_splash: ^2.4.7
  http: ^1.6.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/onboarding/
    - assets/logo/
    - assets/icon.png
    - assets/logo/logo.gif

flutter_native_splash:
  color: "#0F0F0F" 
  image: assets/icon.png
  android_12:
    image: assets/icon.png
    color: "#0F0F0F"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0F0F0F"
  adaptive_icon_foreground: "assets/icon.png"